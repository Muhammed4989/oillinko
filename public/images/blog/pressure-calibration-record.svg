<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#eef4f8"/>
  <g font-family="Arial, sans-serif" fill="#23374b">
    <text x="62" y="61" font-size="19" font-weight="700" letter-spacing="2">OILLINKO / MEASUREMENT EVIDENCE</text>
    <text x="62" y="113" font-size="37" font-weight="700">Read the result before the conclusion.</text>
    <rect x="62" y="150" width="678" height="400" rx="16" fill="#fff" stroke="#cbd8e4" stroke-width="2"/>
    <text x="91" y="193" font-size="24" font-weight="700">INSTRUMENT IDENTITY</text>
    <text x="91" y="229" font-size="21" fill="#55687b">Serial number / range / units / configuration</text>
    <path d="M 91 253 H 711" stroke="#d6e0e9" stroke-width="2"/>
    <text x="91" y="292" font-size="24" font-weight="700">MEASUREMENT RESULTS</text>
    <g font-size="21" fill="#55687b">
      <text x="91" y="334">Reference value</text><text x="399" y="334">Instrument reading</text>
      <text x="91" y="374">Error or correction</text><text x="399" y="374">Uncertainty</text>
      <text x="91" y="414">Method and conditions</text><text x="399" y="414">As-found / as-left</text>
    </g>
    <rect x="91" y="453" width="620" height="65" rx="8" fill="#eef4f8"/>
    <text x="114" y="493" font-size="22" font-weight="700">Traceability connects the result to its references.</text>
    <path d="M 756 350 H 790" stroke="#d8863f" stroke-width="5"/>
    <path d="M 780 340 L 792 350 L 780 360" fill="none" stroke="#d8863f" stroke-width="5"/>
    <rect x="809" y="227" width="329" height="255" rx="16" fill="#23374b"/>
    <g fill="#fff">
      <text x="836" y="273" font-size="24" font-weight="700">ACCEPTANCE BASIS</text>
      <text x="836" y="323" font-size="22">Which specification?</text>
      <text x="836" y="365" font-size="22">Which decision rule?</text>
      <text x="836" y="407" font-size="22">Which results covered?</text>
      <text x="836" y="450" font-size="19" fill="#f0b57f">Agree before calibration.</text>
    </g>
    <text x="62" y="593" font-size="19" fill="#55687b">Explanatory review map. Not a certificate, actual test result or accreditation claim.</text>
  </g>
</svg>
