<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Pump shaft alignment service scope</title><desc id="desc">Four connected stages: machine identity, baseline, correction, handover.</desc><rect width="1200" height="630" fill="#eaf1f5"/><rect x="50" y="48" width="1100" height="534" rx="28" fill="#fff" stroke="#c4d2dd" stroke-width="2"/><text x="88" y="122" fill="#1b3044" font-family="Arial,sans-serif" font-size="36" font-weight="700">Pump shaft alignment scope</text><text x="88" y="164" fill="#526b80" font-family="Arial,sans-serif" font-size="21">Agree the measurement and work boundary.</text><path d="M160 314H1040" stroke="#db7f35" stroke-width="8" stroke-linecap="round"/><g fill="#1b3044"><circle cx="160" cy="314" r="42"/><circle cx="453" cy="314" r="42"/><circle cx="747" cy="314" r="42"/><circle cx="1040" cy="314" r="42"/></g><g fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle"><text x="160" y="323">1</text><text x="453" y="323">2</text><text x="747" y="323">3</text><text x="1040" y="323">4</text></g><g fill="#1b3044" font-family="Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle"><text x="160" y="396">Machine</text><text x="453" y="396">Baseline</text><text x="747" y="396">Correction</text><text x="1040" y="396">Handover</text></g><g fill="#587187" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="160" y="425">Train and access</text><text x="453" y="425">As-found values</text><text x="747" y="425">Agreed tolerance</text><text x="1040" y="425">As-left report</text></g><rect x="88" y="496" width="1024" height="53" rx="11" fill="#eaf1f5"/><text x="111" y="530" fill="#1b3044" font-family="Arial,sans-serif" font-size="20">Record equipment state during every measurement.</text></svg>
