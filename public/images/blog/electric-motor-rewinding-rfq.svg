<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Electric motor rewinding RFQ workflow</title><desc id="desc">Motor identity, as-found inspection, winding data, authorized repair, final tests and handover.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2c"/><stop offset="1" stop-color="#123d48"/></linearGradient></defs><rect width="1200" height="630" fill="url(#g)"/><text x="68" y="88" fill="#fff" font-family="Arial" font-size="42" font-weight="700">Electric Motor Rewinding RFQ</text><text x="68" y="130" fill="#bfd4da" font-family="Arial" font-size="22">Control the repair from as-found evidence to final acceptance</text><g font-family="Arial"><g fill="#103c49" stroke="#29d4b2" stroke-width="2"><rect x="65" y="205" width="165" height="185" rx="18"/><rect x="245" y="205" width="165" height="185" rx="18"/><rect x="425" y="205" width="165" height="185" rx="18"/><rect x="605" y="205" width="165" height="185" rx="18"/><rect x="785" y="205" width="165" height="185" rx="18"/><rect x="965" y="205" width="170" height="185" rx="18"/></g><g fill="#29d4b2" font-size="17" font-weight="700"><text x="88" y="245">IDENTITY</text><text x="268" y="245">AS-FOUND</text><text x="448" y="245">DATA</text><text x="628" y="245">APPROVE</text><text x="808" y="245">TEST</text><text x="988" y="245">HANDOVER</text></g><g fill="#fff" font-size="18"><text x="88" y="295">Nameplate</text><text x="88" y="323">and duty</text><text x="268" y="295">Condition and</text><text x="268" y="323">diagnosis</text><text x="448" y="295">Original winding</text><text x="448" y="323">record</text><text x="628" y="295">Conditional</text><text x="628" y="323">repair scope</text><text x="808" y="295">Actual values</text><text x="808" y="323">and criteria</text><text x="988" y="295">Traceable</text><text x="988" y="323">dossier</text></g></g><rect x="65" y="460" width="1070" height="92" rx="18" fill="#fff" opacity=".08"/><text x="95" y="500" fill="#fff" font-family="Arial" font-size="22" font-weight="700">Do not authorize a rewind before the failure condition and work boundary are documented.</text><text x="95" y="535" fill="#bfd4da" font-family="Arial" font-size="18">Oillinko buyer guide • rotating electrical machines • repair evidence</text></svg>
