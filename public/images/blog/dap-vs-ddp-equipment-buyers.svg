<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">DAP versus DDP equipment delivery</title><desc id="desc">Comparison of transport, import clearance, duties, delivery and unloading responsibilities.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2c"/><stop offset="1" stop-color="#113c47"/></linearGradient></defs><rect width="1200" height="630" fill="url(#g)"/><text x="70" y="88" fill="#fff" font-family="Arial" font-size="44" font-weight="700">DAP vs DDP</text><text x="70" y="130" fill="#c1d5dc" font-family="Arial" font-size="22">Define the import and landed-cost boundary before award</text><g font-family="Arial"><rect x="70" y="205" width="500" height="260" rx="22" fill="#103c49" stroke="#29d4b2" stroke-width="3"/><rect x="630" y="205" width="500" height="260" rx="22" fill="#103c49" stroke="#f4a62a" stroke-width="3"/><text x="105" y="255" fill="#29d4b2" font-size="34" font-weight="700">DAP</text><text x="665" y="255" fill="#f4a62a" font-size="34" font-weight="700">DDP</text><g fill="#fff" font-size="21"><text x="105" y="310">Seller: transport to named place</text><text x="105" y="350">Buyer: import clearance</text><text x="105" y="390">Buyer: duties and import taxes</text><text x="665" y="310">Seller: transport to named place</text><text x="665" y="350">Seller: import clearance</text><text x="665" y="390">Seller: duties under the rule</text></g><g fill="#c1d5dc" font-size="18"><text x="105" y="435">Delivery: ready for unloading</text><text x="665" y="435">Delivery: ready for unloading</text></g></g><rect x="70" y="505" width="1060" height="62" rx="16" fill="#fff" opacity=".08"/><text x="100" y="544" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Name the exact place • confirm importer feasibility • itemize destination costs</text></svg>
