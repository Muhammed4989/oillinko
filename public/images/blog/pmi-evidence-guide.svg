  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#142836">
    <g font-size="34" font-weight="700"><text x="228" y="411">Chemistry</text><text x="600" y="411">Identity</text><text x="972" y="411">Specification</text></g>
