<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Partial award RFQ comparison</title><desc id="desc">Package and line-item offers pass through technical, delivery and contract checks before award.</desc><rect width="1200" height="630" fill="#eaf1f5"/><rect x="50" y="48" width="1100" height="534" rx="28" fill="#fff" stroke="#c4d2dd" stroke-width="2"/><text x="88" y="122" fill="#1b3044" font-family="Arial,sans-serif" font-size="36" font-weight="700">Package or partial award?</text><text x="88" y="164" fill="#526b80" font-family="Arial,sans-serif" font-size="21">Compare the total evaluated scope, not just unit prices.</text><rect x="90" y="228" width="385" height="90" rx="15" fill="#1b3044"/><text x="282" y="284" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle">One package offer</text><rect x="725" y="228" width="385" height="90" rx="15" fill="#1b3044"/><text x="917" y="284" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="middle">Several line offers</text><path d="M282 318V371H600M917 318V371H600V408" fill="none" stroke="#db7f35" stroke-width="8" stroke-linecap="round"/><rect x="260" y="408" width="680" height="94" rx="16" fill="#eaf1f5" stroke="#c4d2dd"/><text x="600" y="448" fill="#1b3044" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle">Compliance · Interfaces · Delivery · Documents</text><text x="600" y="476" fill="#526b80" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Then compare cost and responsibility on the same basis</text></svg>
