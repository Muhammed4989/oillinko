<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Valve external-emissions evidence chain</title>
  <desc id="desc">A three-column diagram separates qualified design, offered configuration and delivered-unit production test evidence.</desc>
  <rect width="1200" height="630" fill="#edf2f5"/>
  <rect x="54" y="48" width="1092" height="534" rx="28" fill="#fff" stroke="#c3d1da" stroke-width="2"/>
  <text x="88" y="121" fill="#1c3043" font-family="Arial,sans-serif" font-size="35" font-weight="700">ISO 15848 evidence chain</text>
  <text x="88" y="163" fill="#587187" font-family="Arial,sans-serif" font-size="21">Type qualification and production acceptance answer different questions.</text>
  <path d="M326 319 H874" stroke="#e38338" stroke-width="8" stroke-linecap="round"/>
  <g fill="#1c3043"><circle cx="200" cy="319" r="55"/><circle cx="600" cy="319" r="55"/><circle cx="1000" cy="319" r="55"/></g>
  <g fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle"><text x="200" y="329">1</text><text x="600" y="329">2</text><text x="1000" y="329">3</text></g>
  <g fill="#1c3043" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle"><text x="200" y="415">Qualified design</text><text x="600" y="415">Offered valve</text><text x="1000" y="415">Delivered units</text></g>
  <g fill="#587187" font-family="Arial,sans-serif" font-size="18" text-anchor="middle"><text x="200" y="447">Type-test scope</text><text x="600" y="447">Configuration match</text><text x="1000" y="447">Serial-linked records</text></g>
  <rect x="88" y="497" width="1024" height="52" rx="10" fill="#edf2f5"/>
  <text x="110" y="531" fill="#1c3043" font-family="Arial,sans-serif" font-size="20">External leakage evidence is separate from seat-leakage testing.</text>
</svg>
