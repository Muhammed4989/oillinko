<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Laboratory evidence review diagram linking accreditation identity, covered activity and the delivered report.</title><rect width="1200" height="675" fill="#f1f5f9"/><rect x="62" y="65" width="74" height="7" rx="3" fill="#d97706"/><g font-family="Arial, sans-serif"><text x="62" y="118" font-size="24" font-weight="700" fill="#475569">OILLINKO / BUYER GUIDES</text><text x="62" y="184" font-size="34" font-weight="700" fill="#0f172a">Match accreditation to the activity you are buying</text><rect x="62" y="238" width="328" height="274" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="86" y="291" font-size="24" font-weight="700" fill="#b45309">IDENTITY</text><text x="86" y="355" font-size="22" fill="#334155">Body and lab reference</text><text x="86" y="402" font-size="22" fill="#334155">Current public record</text><text x="86" y="449" font-size="22" fill="#334155">Covered location</text><rect x="437" y="238" width="328" height="274" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="461" y="291" font-size="24" font-weight="700" fill="#b45309">SCOPE</text><text x="461" y="355" font-size="22" fill="#334155">Activity and method</text><text x="461" y="402" font-size="22" fill="#334155">Material or parameter</text><text x="461" y="449" font-size="22" fill="#334155">Range and conditions</text><rect x="812" y="238" width="328" height="274" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="836" y="291" font-size="24" font-weight="700" fill="#b45309">REPORT</text><text x="836" y="355" font-size="22" fill="#334155">Item and sample link</text><text x="836" y="402" font-size="22" fill="#334155">Results and limitations</text><text x="836" y="449" font-size="22" fill="#334155">Acceptance basis</text><path d="M408 375h18m-8-9 9 9-9 9M783 375h18m-8-9 9 9-9 9" stroke="#d97706" stroke-width="3" fill="none"/><text x="62" y="586" font-size="23" fill="#334155">Identify the requirement, re