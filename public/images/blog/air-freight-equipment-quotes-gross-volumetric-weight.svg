<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Air freight quote diagram linking packed cargo measurements, rating assumptions and transport scope.</title><rect width="1200" height="675" fill="#f1f5f9"/><rect x="62" y="65" width="74" height="7" rx="3" fill="#d97706"/><g font-family="Arial, sans-serif"><text x="62" y="118" font-size="24" font-weight="700" fill="#475569">OILLINKO / BUYER GUIDES</text><text x="62" y="184" font-size="34" font-weight="700" fill="#0f172a">Compare the same packed cargo</text><rect x="62" y="238" width="328" height="274" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="86" y="291" font-size="24" font-weight="700" fill="#b45309">CARGO DATA</text><text x="86" y="355" font-size="22" fill="#334155">Package identifiers</text><text x="86" y="402" font-size="22" fill="#334155">External L / W / H</text><text x="86" y="449" font-size="22" fill="#334155">Gross weight incl. packing</text><rect x="437" y="238" width="328" height="274" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="461" y="291" font-size="24" font-weight="700" fill="#b45309">RATING BASIS</text><text x="461" y="355" font-size="22" fill="#334155">Confirmed density factor</text><text x="461" y="402" font-size="22" fill="#334155">Aggregation and rounding</text><text x="461" y="449" font-size="22" fill="#334155">Declared chargeable weight</text><rect x="812" y="238" width="328" height="274" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="836" y="291" font-size="24" font-weight="700" fill="#b45309">SERVICE SCOPE</text><text x="836" y="355" font-size="22" fill="#334155">Collection to delivery</text><text x="836" y="402" font-size="22" fill="#334155">Handling and exclusions</text><text x="836" y="449" font-size="22" fill="#334155">Validity and readiness</text><path d="M408 375h18m-8-9 9 9-9 9M783 375h18m-8-9 9 9-9 9" stroke="#d97706" stroke-width="3" fill="none"/><text x="62" y="586" font-size="23" fill="#334155">Review one defined requirement against one traceable offer.</text></g></svg>