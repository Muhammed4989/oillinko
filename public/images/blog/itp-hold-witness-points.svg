<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f1f5f9"/><text x="64" y="74" fill="#0f766e" font-family="Arial" font-size="22" font-weight="700">OILLINKO / EQUIPMENT PROCUREMENT</text><text x="64" y="139" fill="#0f172a" font-family="Arial" font-size="43" font-weight="700">Hold point or witness point?</text><rect x="64" y="184" width="520" height="294" rx="20" fill="#fff" stroke="#cbd5e1"/><rect x="614" y="184" width="520" height="294" rx="20" fill="#fff" stroke="#cbd5e1"/><text x="96" y="240" font-family="Arial" font-size="31" font-weight="700" fill="#92400e">HOLD</text><text x="646" y="240" font-family="Arial" font-size="31" font-weight="700" fill="#0f766e">WITNESS</text><g font-family="Arial" font-size="26" fill="#334155"><text x="96" y="302">Defined stop boundary</text><text x="96" y="354">Required authorization</text><text x="96" y="406">Recorded release</text><text x="646" y="302">Agreed readiness notice</text><text x="646" y="354">Attendance opportunity</text><text x="646" y="406">Contract rules apply</text></g><text x="64" y="540" fill="#0f172a" font-family="Arial" font-size="25" font-weight="700">BOTH: identified items, acceptance criteria and traceable records</text><text x="64" y="584" fill="#475569" font-family="Arial" font-size="22">Confirm the project ITP legend. Attendance alone does not accept the equipment.</text></svg>