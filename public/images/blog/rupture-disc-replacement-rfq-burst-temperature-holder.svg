<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Rupture disc enquiry records linking installed identification and approved burst conditions to the offered assembly and technical review.</title><rect width="1200" height="675" fill="#f1f5f9"/><g font-family="Arial,sans-serif"><rect x="54" y="65" width="72" height="7" fill="#d97706"/><text x="54" y="121" font-size="24" fill="#475569" font-weight="bold">OILLINKO / BUYER GUIDES</text><text x="54" y="185" font-size="32" fill="#0f172a" font-weight="bold">Identify the complete replacement assembly</text><rect x="54" y="240" width="336" height="285" rx="16" fill="white" stroke="#cbd5e1"/><text x="72" y="294" font-size="21" font-weight="700" fill="#b45309">INSTALLED RECORD</text><text x="72" y="353" font-size="19" fill="#334155">Disc and holder references</text><text x="72" y="402" font-size="19" fill="#334155">Tag / drawing revision</text><text x="72" y="451" font-size="19" fill="#334155">Retained components</text><rect x="431" y="240" width="336" height="285" rx="16" fill="white" stroke="#cbd5e1"/><text x="449" y="294" font-size="21" font-weight="700" fill="#b45309">APPROVED DUTY</text><text x="449" y="353" font-size="19" fill="#334155">Burst pressure + temperature</text><text x="449" y="402" font-size="19" fill="#334155">Operating cases and units</text><text x="449" y="451" font-size="19" fill="#334155">Required review basis</text><rect x="808" y="240" width="336" height="285" rx="16" fill="white" stroke="#cbd5e1"/><text x="826" y="294" font-size="21" font-weight="700" fill="#b45309">OFFERED REPLACEMENT</text><text x="826" y="353" font-size="19" fill="#334155">Identified assembly</text><text x="826" y="402" font-size="19" fill="#334155">Declared differences</text><text x="826" y="451" font-size="19" fill="#334155">Evidence and approval</text><path d="M397 380h24m-9-8 9 8-9 8M774 380h24m-9-8 9 8-9 8" fill="none" stroke="#d97706" stroke-width="3"/><text x="54" y="590" font-size="23" fill="#334155">Matching nominal size alone does not establish compatibility.</text></g></svg>