<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Match the person to the inspection assignment</title><rect width="1200" height="675" fill="#f1f5f9"/><g font-family="Arial,sans-serif"><rect x="54" y="65" width="72" height="7" fill="#d97706"/><text x="54" y="121" font-size="24" fill="#475569" font-weight="bold">OILLINKO / BUYER GUIDES</text><text x="54" y="185" font-size="32" fill="#0f172a" font-weight="bold">Match the person to the inspection assignment</text><rect x="54" y="244" width="336" height="277" rx="16" fill="white" stroke="#cbd5e1"/><text x="76" y="298" font-size="23" font-weight="700" fill="#b45309">ASSIGNMENT</text><text x="76" y="358" font-size="20" fill="#334155">Method and work scope</text><text x="76" y="406" font-size="20" fill="#334155">Required route and level</text><text x="76" y="454" font-size="20" fill="#334155">Procedure / review roles</text><rect x="431" y="244" width="336" height="277" rx="16" fill="white" stroke="#cbd5e1"/><text x="453" y="298" font-size="23" font-weight="700" fill="#b45309">PERSONNEL RECORD</text><text x="453" y="358" font-size="20" fill="#334155">Named person and issuer</text><text x="453" y="406" font-size="20" fill="#334155">Scope and current status</text><text x="453" y="454" font-size="20" fill="#334155">Verification date / result</text><rect x="808" y="244" width="336" height="277" rx="16" fill="white" stroke="#cbd5e1"/><text x="830" y="298" font-size="23" font-weight="700" fill="#b45309">HANDOVER</text><text x="830" y="358" font-size="20" fill="#334155">Actual personnel and roles</text><text x="830" y="406" font-size="20" fill="#334155">Approved changes</text><text x="830" y="454" font-size="20" fill="#334155">Traceable final report</text><path d="M397 380h24m-9-8 9 8-9 8M774 380h24m-9-8 9 8-9 8" fill="none" stroke="#d97706" stroke-width="3"/><text x="54" y="590" font-size="23" fill="#334155">Keep requirements, evidence and approval linked to the same scope.