<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img"><title>Elastomer hardness report diagram linking the specified method, tested specimen and batch acceptance evidence.</title><rect width="1200" height="675" fill="#f1f5f9"/><rect x="62" y="65" width="74" height="7" rx="3" fill="#d97706"/><g font-family="Arial, sans-serif"><text x="62" y="118" font-size="24" font-weight="700" fill="#475569">OILLINKO / BUYER GUIDES</text><text x="62" y="184" font-size="34" font-weight="700" fill="#0f172a">A hardness value needs its measurement context</text><rect x="62" y="238" width="328" height="274" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="86" y="291" font-size="24" font-weight="700" fill="#b45309">METHOD</text><text x="86" y="355" font-size="22" fill="#334155">Standard and edition</text><text x="86" y="402" font-size="22" fill="#334155">Scale and instrument</text><text x="86" y="449" font-size="22" fill="#334155">Acceptance limits</text><rect x="437" y="238" width="328" height="274" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="461" y="291" font-size="24" font-weight="700" fill="#b45309">SPECIMEN</text><text x="461" y="355" font-size="22" fill="#334155">Shape and dimensions</text><text x="461" y="402" font-size="22" fill="#334155">Condition and timing</text><text x="461" y="449" font-size="22" fill="#334155">Sample identity</text><rect x="812" y="238" width="328" height="274" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="836" y="291" font-size="24" font-weight="700" fill="#b45309">RECORD</text><text x="836" y="355" font-size="22" fill="#334155">Individual results</text><text x="836" y="402" font-size="22" fill="#334155">Batch connection</text><text x="836" y="449" font-size="22" fill="#334155">Reviewer decision</text><path d="M408 375h18m-8-9 9 9-9 9M783 375h18m-8-9 9 9-9 9" stroke="#d97706" stroke-width="3" fill="none"/><text x="62" y="586" font-size="23" fill="#334155">Identify the requirement, resolve assumptions