  <rect x="88" y="489" width="1024" height="57" rx="12" fill="#eaf0f4"/>
  <text x="112" y="526" fill="#1d3044" font-family="Arial,sans-serif" font-size="21">Resolve exceptions against the controlled specification before award.</text>
