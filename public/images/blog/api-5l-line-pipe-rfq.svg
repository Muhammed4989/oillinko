      <text x="155" y="318">1</text><text x="333" y="318">2</text><text x="511" y="318">3</text><text x="689" y="318">4</text><text x="867" y="318">5</text><text x="1045" y="318">6</text>
    </g>
    <g fill="#1d3044" font-size="21" font-weight="700">
      <text x="155" y="391">Edition</text><text x="333" y="391">Grade &amp; PSL</text><text x="511" y="391">Dimensions</text><text x="689" y="391">Route</text><text x="867" y="391">Records</text><text x="1045" y="391">Delivery</text>
    </g>
    <g fill="#60758a" font-size="17">
      <text x="155" y="422">Project basis</text><text x="333" y="422">Product identity</text><text x="511" y="422">OD and wall</text><text x="689" y="422">Seamless or weld</text><text x="867" y="422">Traceable tests</text><text x="1045" y="422">Ends and packing</text>
