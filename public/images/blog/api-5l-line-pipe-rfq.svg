<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">API 5L line pipe request for quotation checklist</title>
  <desc id="desc">Six connected review steps: standard edition, grade and PSL, dimensions, manufacture, inspection, and delivery.</desc>
  <rect width="1200" height="630" fill="#eaf0f4"/>
  <rect x="48" y="44" width="1104" height="542" rx="28" fill="#fff" stroke="#b9cbd7" stroke-width="2"/>
  <text x="88" y="113" fill="#1d3044" font-family="Arial,sans-serif" font-weight="700" font-size="35">Line pipe RFQ: define the evidence</text>
  <text x="88" y="157" fill="#60758a" font-family="Arial,sans-serif" font-size="21">A comparable offer answers each question for the same item schedule.</text>
  <path d="M155 309 H1045" stroke="#e58438" stroke-width="10" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#1d3044">
      <circle cx="155" cy="309" r="38"/><circle cx="333" cy="309" r="38"/><circle cx="511" cy="309" r="38"/><circle cx="689" cy="309" r="38"/><circle cx="867" cy="309" r="38"/><circle cx="1045" cy="309" r="38"/>
    </g>
