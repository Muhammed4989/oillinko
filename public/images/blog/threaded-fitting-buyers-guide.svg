<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><rect width="1200" height="630" fill="#f1f5f9"/><text x="60" y="62" fill="#0f766e" font-family="Arial" font-size="22" font-weight="700">OILLINKO / FITTING PROCUREMENT</text><text x="60" y="132" fill="#0f172a" font-family="Arial" font-size="42" font-weight="700">A thread name is not the full specification</text><g fill="#fff" stroke="#cbd5e1"><rect x="60" y="186" width="340" height="265" rx="18"/><rect x="430" y="186" width="340" height="265" rx="18"/><rect x="800" y="186" width="340" height="265" rx="18"/></g><g font-family="Arial" font-weight="700" font-size="27" fill="#0f766e"><text x="86" y="243">THREAD IDENTITY</text><text x="456" y="243">END CONNECTION</text><text x="826" y="243">PRODUCT REVIEW</text></g><g font-family="Arial" font-size="23" fill="#334155"><text x="86" y="307">Family and standard</text><text x="86" y="355">Size and gender</text><text x="86" y="403">Confirmed evidence</text><text x="456" y="307">Mating geometry</text><text x="456" y="355">Seal arrangement</text><text x="456" y="403">Both adapter ends</text><text x="826" y="307">Body and seal materials</text><text x="826" y="355">Actual configuration rating</text><text x="826" y="403">Approved drawing</text></g><text x="60" y="522" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Similar size or apparent engagement does not establish compatibility</text><text x="60" y="576" font-family="Arial" font-size="23" fill="#475569">Identify the connection, resolve deviations and retain the accepted specification.</text></svg>