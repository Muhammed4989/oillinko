  <rect x="72" y="490" width="1092" height="76" rx="16" fill="#102d3e" stroke="#284a5c"/>
  <text x="618" y="522" text-anchor="middle" fill="#e7a93b" font-family="Arial, sans-serif" font-size="20" font-weight="700">ISO 15156 / NACE MR0175 supplements the project design basis</text>
  <text x="618" y="551" text-anchor="middle" fill="#c1d0d7" font-family="Arial, sans-serif" font-size="18">Final material selection remains with the responsible engineering parties.</text>
