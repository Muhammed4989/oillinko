  <g fill="#1c3043"><circle cx="157" cy="307" r="42"/><circle cx="378" cy="307" r="42"/><circle cx="600" cy="307" r="42"/><circle cx="821" cy="307" r="42"/><circle cx="1042" cy="307" r="42"/></g>
