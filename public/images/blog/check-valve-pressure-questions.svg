<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"><rect width="1200" height="630" fill="#f1f5f9"/><text x="60" y="62" font-family="Arial" font-size="22" font-weight="700" fill="#0f766e">OILLINKO / VALVE PROCUREMENT</text><text x="60" y="125" font-family="Arial" font-size="42" font-weight="700" fill="#0f172a">One check valve. Four separate checks.</text><g fill="#fff" stroke="#cbd5e1"><rect x="60" y="169" width="525" height="161" rx="16"/><rect x="615" y="169" width="525" height="161" rx="16"/><rect x="60" y="353" width="525" height="161" rx="16"/><rect x="615" y="353" width="525" height="161" rx="16"/></g><g font-family="Arial" font-size="29" font-weight="700" fill="#0f766e"><text x="88" y="218">CRACKING</text><text x="643" y="218">FLOW</text><text x="88" y="403">RESEALING</text><text x="643" y="403">WORKING RATING</text></g><g font-family="Arial" font-size="25" fill="#334155"><text x="88" y="266">When does flow begin?</text><text x="643" y="266">Does it meet the required duty?</text><text x="88" y="451">What closing conditions apply?</text><text x="643" y="451">Which pressure and temperature?</text></g><text x="60" y="577" font-family="Arial" font-size="23" fill="#475569">Use the exact model, fluid, configuration and manufacturer data.</text></svg>